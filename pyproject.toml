[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gwico-ssr"
version = "0.1.0a1"
description = "In-silico SSR identification and characterization platform for complete genome datasets"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "GWICO-SSR Team"},
]

dependencies = [
    "click>=8.1",
    "tomli>=2.0; python_version < '3.11'",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "biopython>=1.80",
    "intervaltree>=3.1",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "plotly>=5.15",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.11",
    "pytest-timeout>=2.2",
]
pg = [
    "psycopg2-binary>=2.9",
]

[project.scripts]
gwico-ssr = "gwico_ssr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gwico_ssr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.sdist]
include = [
    "src/gwico_ssr/",
    "config/",
    "README.md",
    "pyproject.toml",
]
